<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khôi Phục Mật Khẩu - Coffee Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="images/logo.png">
</head>

<body>

    <div class="auth-page">
        <div class="auth-bg-overlay"></div>

        <div class="auth-card">
            <div class="auth-logo-wrap">
                <a href="index.html">
                    <img src="images/logo.png" alt="Coffee Shop Logo" class="auth-logo">
                </a>
                <h2>Quên Mật Khẩu?</h2>
                <p class="auth-subtitle">Nhập tên tài khoản và thiết lập mật khẩu mới của bạn</p>
            </div>

            <form onsubmit="event.preventDefault(); resetPassword();">
                <div class="input-group">
                    <label for="username">Tên tài khoản</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-user input-icon-lead"></i>
                        <input type="text" id="username" placeholder="Nhập tên đăng nhập của bạn" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="newPassword">Mật khẩu mới</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-lock input-icon-lead"></i>
                        <input type="password" id="newPassword" placeholder="Nhập mật khẩu mới" required>
                        <button type="button" class="btn-toggle-pwd" onclick="togglePassword('newPassword', 'newPwdIcon')" title="Ẩn/Hiện">
                            <i class="fa-solid fa-eye" id="newPwdIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirmPassword">Xác nhận mật khẩu mới</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-shield-check input-icon-lead"></i>
                        <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu mới" required>
                        <button type="button" class="btn-toggle-pwd" onclick="togglePassword('confirmPassword', 'confNewPwdIcon')" title="Ẩn/Hiện">
                            <i class="fa-solid fa-eye" id="confNewPwdIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary auth-button">
                    <i class="fa-solid fa-key"></i>
                    Đặt lại mật khẩu
                </button>
            </form>

            <div style="text-align: center; margin-top: 24px;">
                <a href="login.html" style="font-size: 0.92rem; color: var(--primary-light); font-weight: 600;">
                    <i class="fa-solid fa-arrow-left"></i> Quay lại đăng nhập
                </a>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ai-barista.js"></script>
</body>

</html>
