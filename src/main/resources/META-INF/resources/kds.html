<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDS - Kitchen Display System | Coffee Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" href="images/logo.png">
    <style>
        /* ================================================================
           KDS – HIGH-CONTRAST DARK THEME
           Optimized for tablet / counter displays
           ================================================================ */

        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');

        :root {
            --kds-bg:        #0a0a0a;
            --kds-surface:   #141414;
            --kds-border:    #2a2a2a;

            --col-pending-h: #f59e0b;
            --col-pending-bg: rgba(245, 158, 11, 0.08);
            --col-pending-border: rgba(245, 158, 11, 0.35);

            --col-process-h: #3b82f6;
            --col-process-bg: rgba(59, 130, 246, 0.08);
            --col-process-border: rgba(59, 130, 246, 0.35);

            --col-deliver-h: #10b981;
            --col-deliver-bg: rgba(16, 185, 129, 0.08);
            --col-deliver-border: rgba(16, 185, 129, 0.35);

            --text-bright: #f9fafb;
            --text-muted:  #9ca3af;
            --text-dim:    #6b7280;

            --radius: 12px;
            --transition: 0.2s ease;

            --paid-color: #10b981;
            --unpaid-color: #ef4444;
            --cash-color: #f59e0b;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            font-family: 'Outfit', system-ui, sans-serif;
            background: var(--kds-bg);
            color: var(--text-bright);
            overflow-x: hidden;
        }

        /* ---- HEADER ---- */
        .kds-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            background: var(--kds-surface);
            border-bottom: 1px solid var(--kds-border);
            position: sticky;
            top: 0;
            z-index: 100;
            gap: 16px;
            flex-wrap: wrap;
        }

        .kds-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .kds-brand img { width: 36px; height: 36px; border-radius: 8px; }
        .kds-brand-text { font-size: 1rem; font-weight: 700; color: var(--text-bright); letter-spacing: 0.5px; }
        .kds-brand-sub  { font-size: 0.72rem; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; }

        .kds-header-center {
            display: flex;
            align-items: center;
            gap: 20px;
            flex: 1;
            justify-content: center;
        }

        .kds-clock {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--text-bright);
            font-variant-numeric: tabular-nums;
        }
        .kds-date {
            font-size: 0.78rem;
            color: var(--text-muted);
            text-align: center;
        }

        .kds-active-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid rgba(245, 158, 11, 0.4);
            border-radius: 999px;
            padding: 6px 16px;
            font-size: 0.875rem;
            font-weight: 600;
            color: #f59e0b;
        }
        .kds-active-badge .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #f59e0b;
            animation: pulse-dot 1.6s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.7); }
        }

        .kds-header-actions { display: flex; align-items: center; gap: 10px; }

        .kds-btn-icon {
            width: 42px; height: 42px;
            border-radius: 10px;
            border: 1px solid var(--kds-border);
            background: rgba(255,255,255,0.05);
            color: var(--text-muted);
            font-size: 1.1rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: var(--transition);
        }
        .kds-btn-icon:hover { background: rgba(255,255,255,0.1); color: var(--text-bright); }
        .kds-btn-icon.active { color: #f59e0b; border-color: rgba(245,158,11,0.5); }

        .kds-admin-link {
            display: flex; align-items: center; gap: 7px;
            padding: 8px 16px;
            border-radius: 10px;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--kds-border);
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 600;
            transition: var(--transition);
            white-space: nowrap;
        }
        .kds-admin-link:hover { background: rgba(255,255,255,0.12); color: var(--text-bright); }

        /* ---- KANBAN BOARD ---- */
        .kds-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            padding: 20px;
            min-height: calc(100vh - 70px);
            align-items: start;
        }

        .kds-column {
            border-radius: var(--radius);
            border: 1px solid var(--kds-border);
            background: var(--kds-surface);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .kds-col-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--kds-border);
        }

        .kds-col-header .col-count {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 999px;
        }

        /* Column colour accents */
        .col-pending  .kds-col-header { background: var(--col-pending-bg); color: var(--col-pending-h); border-bottom-color: var(--col-pending-border); }
        .col-pending  .col-count { background: rgba(245,158,11,0.15); color: var(--col-pending-h); }
        .col-process  .kds-col-header { background: var(--col-process-bg); color: var(--col-process-h); border-bottom-color: var(--col-process-border); }
        .col-process  .col-count { background: rgba(59,130,246,0.15); color: var(--col-process-h); }
        .col-deliver  .kds-col-header { background: var(--col-deliver-bg); color: var(--col-deliver-h); border-bottom-color: var(--col-deliver-border); }
        .col-deliver  .col-count { background: rgba(16,185,129,0.15); color: var(--col-deliver-h); }

        .kds-col-body {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            max-height: calc(100vh - 150px);
        }

        /* ---- ORDER CARD ---- */
        .order-card {
            background: #1a1a1a;
            border-radius: var(--radius);
            border: 1px solid var(--kds-border);
            padding: 14px;
            transition: transform var(--transition), box-shadow var(--transition);
            animation: card-in 0.35s ease;
        }
        @keyframes card-in {
            from { opacity: 0; transform: translateY(-8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .order-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.5); }

        /* Urgency tint for old PENDING orders */
        .order-card.urgent { border-color: rgba(239,68,68,0.5); }
        .order-card.urgent .card-id { color: #ef4444; }

        .card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 10px;
            gap: 8px;
        }

        .card-id {
            font-size: 1rem;
            font-weight: 800;
            color: var(--text-bright);
        }
        .card-customer { font-size: 0.78rem; color: var(--text-muted); font-weight: 500; margin-top: 2px; }

        .card-elapsed {
            display: flex; align-items: center; gap: 5px;
            font-size: 0.75rem; font-weight: 700;
            padding: 3px 9px;
            border-radius: 6px;
            white-space: nowrap;
        }
        .col-pending  .card-elapsed { background: rgba(245,158,11,0.15); color: var(--col-pending-h); }
        .col-process  .card-elapsed { background: rgba(59,130,246,0.15); color: var(--col-process-h); }
        .col-deliver  .card-elapsed { background: rgba(16,185,129,0.15); color: var(--col-deliver-h); }

        /* Items list */
        .card-items {
            border-top: 1px solid var(--kds-border);
            padding-top: 10px;
            margin-top: 4px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .card-item {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            font-size: 0.82rem;
        }
        .card-item-qty {
            min-width: 24px;
            height: 22px;
            line-height: 22px;
            text-align: center;
            border-radius: 5px;
            background: rgba(255,255,255,0.07);
            color: var(--text-bright);
            font-weight: 700;
            font-size: 0.78rem;
        }
        .card-item-name { color: var(--text-bright); font-weight: 500; line-height: 1.4; }
        .card-item-blend { color: var(--text-dim); font-size: 0.72rem; font-style: italic; }

        /* Notes */
        .card-notes {
            margin-top: 8px;
            padding: 7px 10px;
            background: rgba(255,255,255,0.03);
            border-left: 3px solid #f59e0b;
            border-radius: 0 6px 6px 0;
            font-size: 0.78rem;
            color: #d97706;
            font-style: italic;
        }

        /* Payment status */
        .card-footer {
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
        }
        .pay-tag {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 999px;
            letter-spacing: 0.5px;
        }
        .pay-tag.paid      { background: rgba(16,185,129,0.15); color: #10b981; border: 1px solid rgba(16,185,129,0.3); }
        .pay-tag.unpaid    { background: rgba(239,68,68,0.12);  color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }
        .pay-tag.cash      { background: rgba(245,158,11,0.12); color: #f59e0b; border: 1px solid rgba(245,158,11,0.3); }

        /* Action button */
        .card-btn {
            width: 100%;
            margin-top: 12px;
            padding: 10px;
            border-radius: 10px;
            border: none;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            letter-spacing: 0.3px;
        }
        .card-btn:active { transform: scale(0.97); }
        .card-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-start    { background: linear-gradient(135deg, #d97706, #f59e0b); color: #000; }
        .btn-start:hover:not(:disabled) { background: linear-gradient(135deg, #f59e0b, #fbbf24); box-shadow: 0 4px 16px rgba(245,158,11,0.4); }
        .btn-done     { background: linear-gradient(135deg, #2563eb, #3b82f6); color: #fff; }
        .btn-done:hover:not(:disabled) { background: linear-gradient(135deg, #3b82f6, #60a5fa); box-shadow: 0 4px 16px rgba(59,130,246,0.4); }
        .btn-received { background: linear-gradient(135deg, #059669, #10b981); color: #fff; }
        .btn-received:hover:not(:disabled) { background: linear-gradient(135deg, #10b981, #34d399); box-shadow: 0 4px 16px rgba(16,185,129,0.4); }

        /* Empty state */
        .kds-empty {
            padding: 40px 20px;
            text-align: center;
            color: var(--text-dim);
        }
        .kds-empty i { font-size: 2rem; margin-bottom: 8px; display: block; }
        .kds-empty p { font-size: 0.82rem; }

        /* Toast */
        .kds-toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 999;
            display: flex;
            flex-direction: column-reverse;
            gap: 10px;
        }
        .kds-toast {
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #000;
            background: #f59e0b;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            animation: toast-in 0.3s ease;
            display: flex; align-items: center; gap: 8px;
        }
        @keyframes toast-in {
            from { opacity: 0; transform: translateX(20px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        .kds-toast.success { background: #10b981; }
        .kds-toast.error   { background: #ef4444; color: #fff; }
        .kds-toast.info    { background: #3b82f6; color: #fff; }

        /* Loader overlay */
        #kds-loader {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            display: flex; align-items: center; justify-content: center;
            z-index: 200; backdrop-filter: blur(4px);
        }
        .kds-spinner {
            width: 48px; height: 48px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #f59e0b;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Responsive */
        @media (max-width: 900px) {
            .kds-board { grid-template-columns: 1fr; }
            .kds-col-body { max-height: 400px; }
        }
    </style>
</head>

<body>

    <!-- LOADER -->
    <div id="kds-loader">
        <div class="kds-spinner"></div>
    </div>

    <!-- HEADER -->
    <header class="kds-header">
        <div class="kds-brand">
            <img src="images/logo.png" alt="Logo">
            <div>
                <div class="kds-brand-text">Coffee Shop</div>
                <div class="kds-brand-sub">Kitchen Display</div>
            </div>
        </div>

        <div class="kds-header-center">
            <div>
                <div class="kds-clock" id="kds-clock">00:00:00</div>
                <div class="kds-date"  id="kds-date">--</div>
            </div>
            <div class="kds-active-badge">
                <span class="dot"></span>
                <span id="kds-active-count">0</span> đơn đang hoạt động
            </div>
        </div>

        <div class="kds-header-actions">
            <button class="kds-btn-icon active" id="kds-mute-btn" title="Âm thanh" onclick="toggleMute()">
                <i class="fa-solid fa-volume-high"></i>
            </button>
            <a href="admin-orders.html" class="kds-admin-link">
                <i class="fa-solid fa-gauge-high"></i>
                Admin
            </a>
        </div>
    </header>

    <!-- KANBAN BOARD -->
    <div class="kds-board">

        <!-- Column 1: PENDING -->
        <div class="kds-column col-pending">
            <div class="kds-col-header">
                <span><i class="fa-solid fa-hourglass-start" style="margin-right:8px"></i>Chờ pha chế</span>
                <span class="col-count" id="count-pending">0</span>
            </div>
            <div class="kds-col-body" id="col-pending"></div>
        </div>

        <!-- Column 2: PROCESSING -->
        <div class="kds-column col-process">
            <div class="kds-col-header">
                <span><i class="fa-solid fa-fire-flame-curved" style="margin-right:8px"></i>Đang pha chế</span>
                <span class="col-count" id="count-processing">0</span>
            </div>
            <div class="kds-col-body" id="col-processing"></div>
        </div>

        <!-- Column 3: DELIVERING -->
        <div class="kds-column col-deliver">
            <div class="kds-col-header">
                <span><i class="fa-solid fa-bell-concierge" style="margin-right:8px"></i>Sẵn sàng nhận / Giao</span>
                <span class="col-count" id="count-delivering">0</span>
            </div>
            <div class="kds-col-body" id="col-delivering"></div>
        </div>

    </div>

    <!-- TOAST CONTAINER -->
    <div class="kds-toast-container" id="kds-toasts"></div>

    <script src="js/kds.js"></script>
</body>
</html>
