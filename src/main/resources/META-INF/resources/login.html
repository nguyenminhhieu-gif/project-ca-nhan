<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Coffee Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="images/logo.png">
</head>

<body>

    <div class="auth-page">
        <div class="auth-bg-overlay"></div>

        <div class="auth-card">
            <div class="auth-logo-wrap">
                <a href="index.html">
                    <img src="images/logo.png" alt="Coffee Shop Logo" class="auth-logo">
                </a>
                <h2>Chào Mừng Trở Lại</h2>
                <p class="auth-subtitle">Đăng nhập tài khoản để thưởng thức cà phê và nhận ưu đãi đặc quyền</p>
            </div>

            <form onsubmit="event.preventDefault(); login();">
                <div class="input-group">
                    <label for="username">Tên đăng nhập</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-user input-icon-lead"></i>
                        <input type="text" id="username" placeholder="Nhập tên đăng nhập" required autocomplete="username">
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Mật khẩu</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-lock input-icon-lead"></i>
                        <input type="password" id="password" placeholder="Nhập mật khẩu" required autocomplete="current-password">
                        <button type="button" class="btn-toggle-pwd" onclick="togglePassword('password', 'pwdIcon')" title="Ẩn/Hiện mật khẩu">
                            <i class="fa-solid fa-eye" id="pwdIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="auth-auxiliary">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe" style="accent-color: var(--primary);">
                        <span>Ghi nhớ đăng nhập</span>
                    </label>
                    <a href="forgot-password.html" class="forgot-link">Quên mật khẩu?</a>
                </div>

                <button type="submit" class="btn btn-primary auth-button">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    Đăng nhập
                </button>
            </form>

            <p class="auth-footer-text">
                Chưa có tài khoản?
                <a href="register.html">Đăng ký ngay</a>
            </p>

            <div style="text-align: center; margin-top: 18px;">
                <a href="index.html" style="font-size: 0.88rem; color: var(--text-muted); transition: var(--transition-fast);">
                    <i class="fa-solid fa-arrow-left"></i> Quay lại trang chủ
                </a>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ai-barista.js"></script>
</body>

</html>
